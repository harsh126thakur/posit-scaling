[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "positscale"
version = "0.1.0"
description = "Optimal diagonal scaling for posit arithmetic"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YOUR NAME", email = "you@institute.edu" }]
keywords = ["posit", "arithmetic", "tapered precision", "matrix scaling",
            "equilibration", "numerical linear algebra", "embedded"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
experiments = ["pandas>=1.5", "matplotlib>=3.6"]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/harsh126thakur/posit-scaling"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
